openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /study-plan:
    get:
      operationId: getStudyPlan
      responses:
        "200":
          description: Authenticated student's plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudPlan" }
        "401": { description: Sign in required }
    put:
      operationId: putStudyPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudPlanInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudPlan" }
        "409": { description: Revision conflict }
        "400": { description: Invalid plan or missing consent }
        "401": { description: Sign in required }
  /push/config:
    get:
      operationId: pushConfig
      responses:
        "200":
          description: Public application server key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushConfig"
  /push/subscription:
    get:
      operationId: pushStatus
      security: [{ deviceToken: [] }]
      responses:
        "200":
          description: Device subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushStatus"
        "401": { description: Invalid device token }
    put:
      operationId: savePushSubscription
      security: [{ deviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushPlan"
      responses:
        "204": { description: Subscription and schedule saved }
        "400": { description: Invalid schedule or subscription }
        "401": { description: Invalid device token }
        "409": { description: Subscription belongs to another device }
    delete:
      operationId: deletePushSubscription
      security: [{ deviceToken: [] }]
      responses:
        "204": { description: Subscription and pending reminders deleted }
        "401": { description: Invalid device token }
  /push/delivery:
    post:
      operationId: pushDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushReceipt"
      responses:
        "200":
          description: Reminder still exists and is deliverable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushMessage"
        "400": { description: Invalid receipt }
        "404": { description: Cancelled or expired reminder }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
  schemas:
    CloudSubject:
      type: object
      additionalProperties: false
      required: [id, name, color]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 80 }
        color: { type: string, maxLength: 30 }
        teacher: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 300 }
    CloudTask:
      type: object
      additionalProperties: false
      required: [id, title, type, dueAt, priority, status]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        subjectId: { type: string, maxLength: 100 }
        type: { type: string, enum: [homework, study, project, exam] }
        dueAt: { type: string, format: date-time }
        priority: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [not-started, in-progress, completed] }
        completedAt: { type: string, format: date-time }
        reminderAt: { type: string, format: date-time }
        studyStart: { type: string, format: date-time }
        studyEnd: { type: string, format: date-time }
    PlanRecords:
      type: object
      additionalProperties: false
      required: [subjects, tasks]
      properties:
        subjects:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/CloudSubject" }
        tasks:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/CloudTask" }
    CloudPlan:
      type: object
      required: [revision, plan]
      properties:
        revision: { type: integer, minimum: 0 }
        plan: { $ref: "#/components/schemas/PlanRecords" }
    CloudPlanInput:
      type: object
      additionalProperties: false
      required: [revision, plan, consent]
      properties:
        revision: { type: integer, minimum: 0 }
        plan: { $ref: "#/components/schemas/PlanRecords" }
        consent: { type: boolean, enum: [true] }
    PushConfig:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: string }
    PushStatus:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    PushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 87, maxLength: 88 }
            auth: { type: string, minLength: 22, maxLength: 24 }
    PushReminder:
      type: object
      required: [id, title, remindAt, dueAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        title: { type: string, minLength: 1, maxLength: 160 }
        remindAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
    PushPlan:
      type: object
      required: [subscription, reminders]
      properties:
        subscription: { $ref: "#/components/schemas/PushSubscription" }
        reminders:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/PushReminder" }
    PushReceipt:
      type: object
      required: [id, receipt]
      properties:
        id: { type: string, format: uuid }
        receipt: { type: string, minLength: 43, maxLength: 43 }
    PushMessage:
      type: object
      required: [title, taskId]
      properties:
        title: { type: string }
        taskId: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

